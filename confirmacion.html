<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correo confirmado — Manadario</title>
<meta name="theme-color" content="#0B0F19">
<link rel="icon" type="image/png" href="icono.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --fondo:#0B0F19; --vidrio:rgba(255,255,255,.055); --vidrio-fuerte:rgba(255,255,255,.09); --linea:rgba(255,255,255,.10); --linea-suave:rgba(255,255,255,.06);
    --texto:#E6EAF2; --texto-2:#94A3B8; --tenue:#64748B;
    --cian:#0891B2; --cian-l:#06B6D4; --cian-t:#7FDBEA; --cian-s:#0B2A33;
    --violeta:#8B5CF6; --magenta-t:#F9A8D4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--fondo)}
  .orbes{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(36rem 28rem at 0% -8%,rgba(6,182,212,.13),transparent 62%),
               radial-gradient(34rem 26rem at 104% 30%,rgba(236,72,153,.08),transparent 62%),
               radial-gradient(40rem 30rem at 40% 112%,rgba(139,92,246,.12),transparent 62%)}
  body{font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--fondo);color:var(--texto);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  body>header,body>main,body>footer{position:relative;z-index:1}
  h1{font-weight:800;letter-spacing:-.03em;line-height:1.1;text-wrap:balance}
  a{color:var(--cian-t);font-weight:600}
  header{padding:22px 20px}
  .marca{display:flex;align-items:center;gap:11px;font-weight:800;font-size:1.2rem;letter-spacing:-.035em;text-decoration:none;color:var(--texto);width:min(760px,100%);margin-inline:auto}
  .marca .sello{width:40px;height:40px;border-radius:12px;overflow:hidden;border:1px solid var(--linea);flex-shrink:0}
  .marca .sello img{width:100%;height:100%;display:block}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
  .tarjeta{width:min(480px,100%);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--linea);border-radius:28px;padding:44px 34px;text-align:center;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .check{width:72px;height:72px;border-radius:50%;background:var(--cian-s);display:grid;place-items:center;margin:0 auto 22px}
  .check svg{width:36px;height:36px}
  .check svg path{stroke:var(--cian-t)}
  h1{font-size:clamp(1.5rem,4vw,1.9rem);margin-bottom:10px}
  .sub{color:var(--texto-2);font-size:1rem;margin-bottom:30px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font-weight:700;border-radius:999px;transition:transform .18s ease,box-shadow .18s ease;border:none;cursor:pointer;font-family:inherit}
  .btn-grande{font-size:1.05rem;padding:17px 30px;width:100%;color:#fff;background:linear-gradient(135deg,var(--cian),#7C3AED);box-shadow:0 12px 30px rgba(8,145,178,.25),inset 0 1px 0 rgba(255,255,255,.2)}
  .btn-grande:hover{transform:translateY(-2px)}
  .nota{margin-top:22px;font-size:.87rem;color:var(--texto-2)}
  footer{padding:24px 20px;text-align:center;font-size:.85rem;color:var(--tenue)}
</style>
</head>
<body>
<div class="orbes" aria-hidden="true"></div>
<header>
  <a class="marca" href="index.html"><span class="sello"><img src="icono.png" alt="" width="40" height="40"></span> Manadario</a>
</header>
<main>
  <div class="tarjeta">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 13l4 4L19 7" stroke="#0A5E58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>¡Tu correo fue confirmado!</h1>
    <p class="sub">Ya puedes volver a la app Manadario e iniciar sesión con tu cuenta.</p>
    <a class="btn btn-grande" id="abrirApp" href="manadario://login">Abrir la app Manadario</a>
    <p class="nota" id="notaEscritorio" hidden>Estás viendo esto desde un computador. Abre la app Manadario desde tu celular para continuar — no hace falta hacer nada más acá.</p>
  </div>
</main>
<footer>© 2026 Manadario · Hecho en Chile</footer>
<script>
  // Heurística simple, solo para mostrar la nota correcta — no bloquea nada
  // si falla la detección, el botón sigue funcionando igual en el celular.
  var esProbablementeCelular = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (!esProbablementeCelular) {
    document.getElementById('notaEscritorio').hidden = false;
  }
</script>
</body>
</html>
